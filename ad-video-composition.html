<html lang="en" style="overflow:hidden; margin:0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/shader-transitions/dist/index.global.js"></script>
    <style>
      :root {
        --forest: #1C3A1A;
        --forest-deep: #0F2410;
        --sage: #A8D5A2;
        --parchment: #FDFAF6;
        --orange: #E8651A;
        --ink: #16261A;
        --font-display: Georgia, "Times New Roman", serif;
        --font-body: Helvetica, Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--forest-deep); color: var(--parchment); }

      .scene { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--forest); }
      .scene-content { width: 100%; height: 100%; position: relative; z-index: 1; }

      .grain { position:absolute; inset:0; pointer-events:none; z-index:50; opacity:0.15; mix-blend-mode:overlay;
        background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.2px), radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.2px);
        background-size: 3px 3px, 5px 5px; background-position: 0 0, 1px 2px; }

      /* Scene 1: messy circular photo, full bleed */
      #s1-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 20%; }
      #s1-overlay { position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,21,9,.05) 40%, rgba(10,21,9,.9) 100%); display:flex; align-items:flex-end; padding:0 100px 90px; }
      #s1-caption { font-family: var(--font-display); font-style:italic; font-size:96px; line-height:1.1; color:#fff; }
      #s1-caption .w1 { font-size:.5em; }
      #s1-caption .w2 { color: var(--orange); font-size:1.15em; }
      #s1-caption .w3 { font-size:.75em; }
      #s1-caption .w4 { color: var(--sage); font-size:1.3em; }

      /* Scene 2: Scan screen */
      .split-scene { display:flex; align-items:center; height:100%; padding:0 100px; gap:80px; }
      .phone-frame { width:400px; height:816px; border-radius:48px; overflow:hidden; box-shadow:0 40px 100px rgba(0,0,0,.6); border:6px solid #0a1509; flex-shrink:0; }
      .phone-frame img { width:100%; height:100%; object-fit:cover; object-position:top; }
      .copy-col { flex:1; }
      .eyebrow { font-family: var(--font-body); font-size:28px; letter-spacing:.2em; text-transform:uppercase; color: var(--sage); margin-bottom:20px; }
      .headline { font-family: var(--font-display); font-weight:700; font-size:88px; line-height:1.08; color: var(--parchment); }
      .headline .accent { color: var(--orange); font-style:italic; }
      .headline-italic { font-family: var(--font-display); font-style:italic; font-size:68px; color: var(--parchment); margin-bottom:16px; }

      /* Scene 4: CTA */
      #s4 .scene-content { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:24px; }
      .cta-headline { font-family: var(--font-display); font-weight:700; font-size:110px; color: var(--parchment); }
      .cta-headline .accent { color: var(--orange); font-style:italic; }
      .cta-sub { font-family: var(--font-body); font-size:36px; color: rgba(253,250,246,.7); }
      .badges { display:flex; gap:24px; margin-top:20px; }
      .badge { background:#000; color:#fff; border-radius:14px; padding:18px 32px; font-family: var(--font-body); text-align:left; }
      .badge .small { display:block; font-size:16px; opacity:.75; }
      .badge .big { display:block; font-size:28px; font-weight:700; }
      .fern-word { font-family: var(--font-display); font-weight:700; font-size:52px; color: var(--sage); margin-top:30px; }
    </style>
  </head>
